# Spring Boot Application Properties for Claude Benchmark Web Interface

# Server configuration - default to 8081 to avoid conflicts
server.port=8081
server.address=0.0.0.0

# Allow special characters (including colons) in query parameters for model names like "anthropic:claude-sonnet-4"
server.tomcat.relaxed-query-chars=|,{,},[,],:

# Error handling - show stacktraces for debugging
spring.web.error.whitelabel.enabled=true
spring.web.error.include-stacktrace=always
spring.web.error.include-exception=true
spring.web.error.include-message=always

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Ensure proper character encoding for request parameters (handles special chars like colons in model names)
server.tomcat.uri-encoding=UTF-8
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# Logging
logging.level.io.schell.llm.benchmark.web=WARN
logging.level.org.springframework.web=WARN

# Static resources - no caching in dev
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.static-path-pattern=/static/**
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
