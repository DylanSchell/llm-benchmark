# Spring Boot Application Properties for Claude Benchmark Web Interface

# Server configuration - default to 8081 to avoid conflicts
server.port=8081
server.address=0.0.0.0

# Allow special characters (including colons) in query parameters for model names like "anthropic:claude-sonnet-4"
server.tomcat.relaxed-query-chars=|,{,},[,],:

# Error handling - show stacktraces for debugging
server.error.whitelabel.enabled=true
server.error.include-stacktrace=always
server.error.include-exception=true
server.error.include-message=always

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Ensure proper character encoding for request parameters (handles special chars like colons in model names)
server.tomcat.uri-encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Logging
logging.level.com.benchmark.web=DEBUG
logging.level.org.springframework.web=INFO

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.static-path-pattern=/static/**
