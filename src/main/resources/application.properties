# Spring Boot Application Properties for Claude Benchmark Web Interface

# Server configuration - default to 8081 to avoid conflicts
server.port=8081
server.address=0.0.0.0

# Error handling - show stacktraces for debugging
server.error.whitelabel.enabled=true
server.error.include-stacktrace=always
server.error.include-exception=true
server.error.include-message=always

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.benchmark.web=DEBUG
logging.level.org.springframework.web=INFO

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.static-path-pattern=/static/**
