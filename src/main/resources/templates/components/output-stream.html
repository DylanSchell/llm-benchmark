<!-- Output Stream Component for Live Benchmark Output -->
<div th:fragment="live-output(session-id)" class="card">
    <h4 style="margin-bottom: 0.5rem;">Live Output</h4>
    <div id="output-container"
         hx-ext="sse"
         th:attr="data-session-id=${session-id}"
         style="max-height: 400px; overflow-y: auto;">

        <!-- SSE connection for live updates -->
        <div sse-connect="/api/benchmark/${session-id}/stream"
             sse-swap="message"
             hx-target="#output-lines"
             hx-swap="beforeend">
            <div id="output-lines" class="output-console">
                <div>Connecting to output stream...</div>
            </div>
        </div>
    </div>

    <script>
        // Auto-scroll the output container
        (function() {
            const container = document.getElementById('output-container');
            const lines = document.getElementById('output-lines');
            if (container && lines) {
                const observer = new MutationObserver(() => {
                    container.scrollTop = container.scrollHeight;
                });
                observer.observe(lines, { childList: true });
            }
        })();
    </script>
</div>
