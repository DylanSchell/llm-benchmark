<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Benchmark Status - Claude Benchmark</title>
</head>
<body>
    <div th:replace="~{layout :: layout(title='Benchmark Status', content=~{::main})}">
        <main>
            <h2 style="margin-bottom: 1.5rem;">Benchmark Running</h2>

            <div class="card">
                <div style="margin-bottom: 1rem;">
                    <strong>Status:</strong> <span id="status-badge" class="status-badge status-pending">PENDING</span>
                </div>
                <div class="progress-bar" style="margin-bottom: 1rem;">
                    <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
                </div>
                <div id="progress-text" style="margin-bottom: 1rem;">0%</div>

                <!-- Live Output -->
                <div class="output-console" id="output-console" style="margin-top: 1rem;">
                    <div>Waiting for output...</div>
                </div>

                <button id="cancel-btn" class="btn btn-danger" style="margin-top: 1rem;" onclick="cancelBenchmark()">Cancel Run</button>
            </div>

            <script th:inline="javascript">
                let currentSessionId = [[${sessionId}]];
                let statusInterval = null;

                function updateStatusDisplay(data) {
                    const badge = document.getElementById('status-badge');
                    const progressFill = document.getElementById('progress-fill');
                    const progressText = document.getElementById('progress-text');

                    badge.className = 'status-badge status-' + data.status.toLowerCase();
                    badge.textContent = data.status;

                    if (data.progress !== undefined) {
                        progressFill.style.width = data.progress + '%';
                        progressText.textContent = Math.round(data.progress) + '% (' +
                            (data.completedExercises || 0) + '/' + (data.totalExercises || 0) + ')';
                    }

                    if (['COMPLETED', 'FAILED', 'CANCELLED'].includes(data.status)) {
                        clearInterval(statusInterval);
                        document.getElementById('cancel-btn').style.display = 'none';
                    }
                }

                function startStatusPolling(sessionId) {
                    statusInterval = setInterval(async () => {
                        const response = await fetch(`/api/benchmark/${sessionId}/status`);
                        const data = await response.json();
                        updateStatusDisplay(data);
                    }, 1000);
                }

                function connectSSE(sessionId) {
                    const eventSource = new EventSource(`/api/benchmark/${sessionId}/stream`);
                    const outputConsole = document.getElementById('output-console');
                    let currentLine = null;

                    eventSource.onmessage = (event) => {
                        if (outputConsole.children.length === 1 && outputConsole.children[0].textContent === 'Waiting for output...') {
                            outputConsole.innerHTML = '';
                            currentLine = null;
                        }

                        // Parse JSON payload to preserve whitespace
                        let data;
                        try {
                            const payload = JSON.parse(event.data);
                            data = payload.data || '';
                        } catch (e) {
                            data = event.data;
                        }

                        if (data.endsWith('\n')) {
                            const line = document.createElement('div');
                            line.style.whiteSpace = 'pre-wrap';
                            line.textContent = data;
                            outputConsole.appendChild(line);
                            currentLine = null;
                        } else if (data) {
                            if (currentLine) {
                                currentLine.textContent += data;
                            } else {
                                currentLine = document.createElement('div');
                                currentLine.style.whiteSpace = 'pre-wrap';
                                currentLine.textContent = data;
                                outputConsole.appendChild(currentLine);
                            }
                        }

                        outputConsole.scrollTop = outputConsole.scrollHeight;
                    };

                    eventSource.onerror = () => {
                        eventSource.close();
                    };
                }

                async function cancelBenchmark() {
                    if (!currentSessionId) return;
                    const response = await fetch(`/api/benchmark/${currentSessionId}/cancel`, {
                        method: 'POST'
                    });
                    const data = await response.json();
                    if (data.status === 'cancelled') {
                        alert('Benchmark cancelled');
                    }
                }

                // Initialize with server-provided session data
                const status = '[[${sessionStatus}]]';
                const progress = [[${sessionProgress}]];
                const completed = [[${sessionCompleted}]];
                const total = [[${sessionTotal}]];
                const accumulatedOutput = [[${sessionOutput}]];

                // Initialize status display
                const badge = document.getElementById('status-badge');
                badge.className = 'status-badge status-' + status.toLowerCase();
                badge.textContent = status;

                const progressFill = document.getElementById('progress-fill');
                const progressText = document.getElementById('progress-text');
                progressFill.style.width = progress + '%';
                progressText.textContent = Math.round(progress) + '% (' + completed + '/' + total + ')';

                // Initialize accumulated output
                if (accumulatedOutput && accumulatedOutput.length > 0) {
                    const output = document.getElementById('output-console');
                    output.innerHTML = '';
                    const pre = document.createElement('pre');
                    pre.style.whiteSpace = 'pre-wrap';
                    pre.style.wordWrap = 'break-word';
                    pre.textContent = accumulatedOutput;
                    output.appendChild(pre);
                    output.scrollTop = output.scrollHeight;
                }

                // Start polling and SSE if not completed
                if (!['COMPLETED', 'FAILED', 'CANCELLED'].includes(status)) {
                    startStatusPolling(currentSessionId);
                    connectSSE(currentSessionId);
                }
            </script>
        </main>
    </div>
</body>
</html>
