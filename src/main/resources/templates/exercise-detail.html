<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exercise Detail - Claude Benchmark</title>
</head>
<body>
    <div th:replace="layout :: layout(title='Exercise Detail', content=~{::main})">
        <main>
            <nav style="margin-bottom: 1rem;">
                <a href="/results" class="btn">&larr; Back to Results</a>
            </nav>

            <h2 style="margin-bottom: 0.5rem;">
                <span th:text="${exercise}">series</span>
                <span style="color: #7f8c8d;">/</span>
                <span th:text="${language}">java</span>
            </h2>

            <!-- Result Card -->
            <div class="card" id="result-card">
                <div th:if="${result != null}">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3>Result</h3>
                        <span th:class="'status-badge ' + (${result.success} ? 'status-completed' : 'status-failed')"
                              th:text="${result.success} ? 'PASSED' : 'FAILED'">PASSED</span>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1rem;">
                        <div>
                            <strong>Exit Code:</strong>
                            <span th:text="${result.exitCode}">0</span>
                        </div>
                        <div>
                            <strong>Duration:</strong>
                            <span th:text="${result.duration}">PT10S</span>
                        </div>
                    </div>

                    <div class="form-group" th:if="${result.errorMessage != null}">
                        <label>Error Message</label>
                        <div class="output-console" style="max-height: 200px; font-size: 0.75rem;" th:text="${result.errorMessage}">Error details...</div>
                    </div>

                    <div class="form-group">
                        <label>Output</label>
                        <div class="output-console" style="max-height: 300px; font-size: 0.75rem;" th:text="${result.output}">Test output...</div>
                    </div>

                    <div class="form-group" th:if="${result.trace != null and result.trace != ''}">
                        <label>Trace (HTML)</label>
                        <button class="btn btn-primary" onclick="document.getElementById('trace-view').style.display = 'block'">View Trace</button>
                        <div id="trace-view" style="display: none; margin-top: 1rem;">
                            <iframe th:src="${'data:text/html;charset=utf-8,' + #strings.escapeHtml(result.trace)}"
                                    style="width: 100%; height: 400px; border: 1px solid #ddd;"></iframe>
                        </div>
                    </div>
                </div>

                <div th:if="${result == null}" style="text-align: center; color: #7f8c8d; padding: 2rem;">
                    <p>No result found for this exercise.</p>
                    <p>Run a benchmark to generate results.</p>
                    <a href="/run" class="btn btn-primary" style="margin-top: 1rem;">Run Benchmark</a>
                </div>
            </div>

            <!-- Run New Benchmark -->
            <div class="card" style="margin-top: 1rem;">
                <h3>Run Benchmark for this Exercise</h3>
                <form id="run-form" style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                    <input type="hidden" name="exercise" th:value="${exercise}">
                    <input type="hidden" name="language" th:value="${language}">

                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="agent-select">Agent</label>
                        <select id="agent-select" name="agent">
                            <option value="reference">Reference</option>
                            <option value="claude">Claude</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Run Now</button>
                </form>
            </div>

            <script>
                document.getElementById('run-form').addEventListener('submit', async function(e) {
                    e.preventDefault();

                    const formData = new FormData(this);
                    const response = await fetch('/api/benchmark/queue/schedule', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    window.location.href = '/';
                });
            </script>
        </main>
    </div>
</body>
</html>
