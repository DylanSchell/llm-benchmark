<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Run Benchmark - Claude Benchmark</title>
    <style>
        .exercise-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 0.5rem;
            margin-top: 0.5rem;
        }
        .exercise-item {
            display: flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
        }
        .exercise-item:hover {
            background-color: #f5f5f5;
        }
        .exercise-item label {
            display: flex;
            align-items: center;
            cursor: pointer;
            flex: 1;
        }
        .exercise-item input[type="checkbox"] {
            margin-right: 0.5rem;
        }
        .select-all-row {
            padding: 0.25rem 0.5rem;
            border-bottom: 1px solid #eee;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div th:replace="~{layout :: layout(title='Run Benchmark', content=~{::main})}">
        <main>
            <h2 style="margin-bottom: 1.5rem;">Start New Benchmark</h2>

            <div class="card">
                <form id="benchmark-form" style="max-width: 600px;">
                    <div class="form-group">
                        <label for="agent">Agent</label>
                        <select id="agent" name="agent" required>
                            <option value="reference">Reference Agent</option>
                            <option value="claude">Claude Agent</option>
                            <option value="pi" selected>Pi Agent</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Language</label>
                        <div class="language-grid">
                            <label class="language-checkbox">
                                <input type="checkbox" name="language" value="java" checked>
                                <span>Java</span>
                            </label>
                            <label class="language-checkbox">
                                <input type="checkbox" name="language" value="go" checked>
                                <span>Go</span>
                            </label>
                            <label class="language-checkbox">
                                <input type="checkbox" name="language" value="javascript" checked>
                                <span>JavaScript</span>
                            </label>
                            <label class="language-checkbox">
                                <input type="checkbox" name="language" value="python" checked>
                                <span>Python</span>
                            </label>
                            <label class="language-checkbox">
                                <input type="checkbox" name="language" value="rust" checked>
                                <span>Rust</span>
                            </label>
                            <label class="language-checkbox">
                                <input type="checkbox" name="language" value="cpp" checked>
                                <span>C++</span>
                            </label>
                        </div>
                        <small style="color: #666;">Select one or more languages</small>
                    </div>

                    <div class="form-group">
                        <label for="model">Model (optional, uses default from config)</label>
                        <select id="model" name="model">
                            <option value="">Use default from config</option>
                            <th:block th:each="model : ${models}">
                                <option th:value="${model}" th:text="${model}"></option>
                            </th:block>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Execution Mode</label>
                        <div style="display: flex; gap: 1rem; margin-top: 0.5rem; flex-wrap: wrap;">
                            <label style="display: flex; align-items: center; cursor: pointer;">
                                <input type="radio" name="mode" value="quick" onchange="toggleExerciseMode()">
                                <span style="margin-left: 0.25rem;">Quick bench</span>
                            </label>
                            <label style="display: flex; align-items: center; cursor: pointer;">
                                <input type="radio" name="mode" value="single" onchange="toggleExerciseMode()">
                                <span style="margin-left: 0.25rem;">Single exercise per language</span>
                            </label>
                            <label style="display: flex; align-items: center; cursor: pointer;">
                                <input type="radio" name="mode" value="all" checked onchange="toggleExerciseMode()">
                                <span style="margin-left: 0.25rem;">All exercises per language</span>
                            </label>
                        </div>
                        <small style="color: #666; display: block; margin-top: 0.25rem;" id="mode-hint">
                            Select one or more languages to run all their exercises
                        </small>
                    </div>

                    <div class="form-group" id="single-exercise-group">
                        <label for="exercise-select">Select Exercises</label>
                        <div id="language-exercises" style="display: block;">
                            <!-- Exercise lists will be populated here -->
                        </div>
                        <small style="color: #666;">Select exercises to run for each language</small>
                    </div>

                    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                        <button type="submit" class="btn btn-primary">Start Benchmark</button>
                    </div>
                </form>
            </div>

            <script>
                let availableExercises = {};
                let selectedExercises = {};

                // Load available exercises on page load
                document.addEventListener('DOMContentLoaded', async function() {
                    try {
                        const response = await fetch('/api/exercises');
                        availableExercises = await response.json();
                        console.log('Loaded exercises:', availableExercises);
                    } catch (e) {
                        console.error('Failed to load exercises:', e);
                    }

                    // Add listeners to language checkboxes
                    document.querySelectorAll('input[name="language"]').forEach(cb => {
                        cb.addEventListener('change', updateExerciseList);
                    });

                    // Update exercise list initially
                    updateExerciseList();
                });

                const modeHints = {
                    quick: "Runs a curated set of fast exercises (< 60s each) across selected languages",
                    single: "Select specific exercises to run for each language",
                    all: "Select one or more languages to run all their exercises"
                };

                function toggleExerciseMode() {
                    const mode = document.querySelector('input[name="mode"]:checked').value;
                    const singleGroup = document.getElementById('single-exercise-group');
                    const modeHint = document.getElementById('mode-hint');
                    if (modeHint) modeHint.textContent = modeHints[mode] || '';

                    if (mode === 'single') {
                        singleGroup.style.display = 'block';
                        // Pre-select all exercises for each selected language
                        const selectedLanguages = Array.from(document.querySelectorAll('input[name="language"]:checked'))
                            .map(cb => cb.value);
                        selectedLanguages.forEach(lang => {
                            const exercises = availableExercises[lang] || [];
                            selectedExercises[lang] = new Set(exercises);
                        });
                        updateExerciseList();
                    } else {
                        singleGroup.style.display = 'none';
                    }
                }

                function updateExerciseList() {
                    const mode = document.querySelector('input[name="mode"]:checked').value;
                    if (mode !== 'single') return;

                    const container = document.getElementById('language-exercises');
                    container.innerHTML = '';

                    const selectedLanguages = Array.from(document.querySelectorAll('input[name="language"]:checked'))
                        .map(cb => cb.value);

                    if (selectedLanguages.length === 0) {
                        container.style.display = 'none';
                        return;
                    }

                    container.style.display = 'block';

                    selectedLanguages.forEach(lang => {
                        const exercises = availableExercises[lang] || [];
                        if (!selectedExercises[lang]) {
                            selectedExercises[lang] = new Set();
                        }

                        const langDiv = document.createElement('div');
                        langDiv.style.marginBottom = '1rem';
                        langDiv.innerHTML = `<strong style="text-transform: capitalize;">${lang}:</strong>`;

                        const exerciseList = document.createElement('div');
                        exerciseList.className = 'exercise-list';

                        // Select all row
                        const selectAllRow = document.createElement('div');
                        selectAllRow.className = 'select-all-row';
                        selectAllRow.innerHTML = `
                            <label style="font-weight: 500;">
                                <input type="checkbox" onchange="toggleSelectAll('${lang}', this.checked)">
                                Select all (${exercises.length})
                            </label>
                        `;
                        exerciseList.appendChild(selectAllRow);

                        exercises.forEach(ex => {
                            const item = document.createElement('div');
                            item.className = 'exercise-item';
                            const isChecked = selectedExercises[lang].has(ex) ? 'checked' : '';
                            item.innerHTML = `
                                <label>
                                    <input type="checkbox" value="${ex}" ${isChecked}
                                           onchange="toggleExercise('${lang}', '${ex}', this.checked)">
                                    ${ex}
                                </label>
                            `;
                            exerciseList.appendChild(item);
                        });

                        langDiv.appendChild(exerciseList);
                        container.appendChild(langDiv);
                    });
                }

                function toggleSelectAll(language, checked) {
                    const exercises = availableExercises[language] || [];
                    if (checked) {
                        selectedExercises[language] = new Set(exercises);
                    } else {
                        selectedExercises[language] = new Set();
                    }
                    updateExerciseList();
                }

                function toggleExercise(language, exercise, checked) {
                    if (!selectedExercises[language]) {
                        selectedExercises[language] = new Set();
                    }
                    if (checked) {
                        selectedExercises[language].add(exercise);
                    } else {
                        selectedExercises[language].delete(exercise);
                    }
                }

                document.getElementById('benchmark-form').addEventListener('submit', async function(e) {
                    e.preventDefault();

                    const agent = document.getElementById('agent').value;
                    const model = document.getElementById('model').value || null;
                    const mode = document.querySelector('input[name="mode"]:checked').value;
                    const languages = Array.from(document.querySelectorAll('input[name="language"]:checked'))
                        .map(cb => cb.value);

                    if (languages.length === 0) {
                        alert('Please select at least one language');
                        return;
                    }

                    // Quick bench mode: no exercise selection needed, just languages
                    if (mode === 'quick') {
                        const formData = new FormData();
                        formData.append('agent', agent);
                        if (model) formData.append('model', model);
                        languages.forEach(lang => formData.append('language', lang));
                        formData.append('mode', 'quick');

                        await fetch('/api/benchmark/queue/schedule', {
                            method: 'POST',
                            body: formData
                        });

                        window.location.href = '/';
                        return;
                    }

                    if (mode === 'single') {
                        // Build queue items from selected exercises
                        const items = [];
                        languages.forEach(lang => {
                            const exercises = selectedExercises[lang] ? Array.from(selectedExercises[lang]) : [];
                            if (exercises.length === 0) {
                                alert('Please select at least one exercise');
                                return;
                            }
                            exercises.forEach(ex => {
                                items.push({
                                    agentName: agent,
                                    model: model,
                                    language: lang,
                                    exercise: ex
                                });
                            });
                        });

                        if (items.length === 0) {
                            return;
                        }

                        // Schedule each item individually
                        for (const item of items) {
                            const formData = new FormData();
                            formData.append('agent', item.agentName);
                            if (item.model) formData.append('model', item.model);
                            formData.append('language', item.language);
                            formData.append('exercise', item.exercise);

                            await fetch('/api/benchmark/queue/schedule', {
                                method: 'POST',
                                body: formData
                            });
                        }

                        window.location.href = '/';
                        return;
                    }

                    // For "all exercises" mode - schedule as individual queue items
                    // so each exercise runs sequentially and the response returns immediately.
                    const formData = new FormData();
                    formData.append('agent', agent);
                    if (model) formData.append('model', model);
                    languages.forEach(lang => formData.append('language', lang));
                    // exercise is null for "all exercises" — scheduleBatch expands to individual items
                    formData.append('mode', 'all');

                    const response = await fetch('/api/benchmark/queue/schedule', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    if (data.items) {
                        window.location.href = '/';
                    }
                });
            </script>
        </main>
    </div>
</body>
</html>
