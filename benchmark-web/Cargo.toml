[package]
name = "benchmark-web"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros", "form", "query", "json", "ws"] }
tower = { version = "0.5", features = ["full"] }
serde_urlencoded = "0.7"
urlencoding = "2.1"
tera = "1"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
benchmark-core = { path = "../crates/benchmark-core" }
benchmark-types = { path = "../crates/benchmark-types" }

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dotenv = "0.15"
