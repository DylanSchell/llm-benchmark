[package]
name = "benchmark-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "benchmark_cli"
path = "src/lib.rs"

[[bin]]
name = "benchmark-cli"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
benchmark-types = { path = "../crates/benchmark-types" }
benchmark-core = { path = "../crates/benchmark-core" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
clap = { workspace = true }

[features]
bin = []
