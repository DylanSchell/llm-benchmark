[workspace]
resolver = "2"
members = [
    "crates/benchmark-types",
    "crates/benchmark-core",
    "benchmark-web",
    "benchmark-report",
    "benchmark-reporter", "benchmark-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["claude-benchmark contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
