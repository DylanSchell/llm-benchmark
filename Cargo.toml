[workspace]
resolver = "2"
members = [
    "crates/benchmark-types",
    "crates/benchmark-core",
    "benchmark-web",
    "benchmark-token-report",
    "benchmark-reporter",
    "benchmark-cli",
]
default-members = ["."]

[package]
name = "llm-benchmark"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Workspace crates
benchmark-types = { path = "crates/benchmark-types" }
benchmark-core = { path = "crates/benchmark-core" }
benchmark-cli = { path = "benchmark-cli" }
benchmark-web = { path = "benchmark-web" }
benchmark-reporter = { path = "benchmark-reporter" }
benchmark-token-report = { path = "benchmark-token-report" }

# All dependency versions managed in [workspace.dependencies]
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tera = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
serde_urlencoded = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }

[[bin]]
name = "llm-benchmark"
path = "src/main.rs"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["llm-benchmark contributors"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Data types
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Web server
axum = { version = "0.8", features = ["macros", "form", "query", "json", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tera = "1"
urlencoding = "2.1"
serde_urlencoded = "0.7"
reqwest = { version = "0.12", features = ["json"] }

# File system
walkdir = "2.5"

# Miscellaneous
regex = "1.10"
rayon = "1.10"
home = "0.5"
once_cell = { version = "1", features = ["std"] }
