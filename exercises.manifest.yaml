# File-level rules applied within each selected exercise, in order (last match wins).
# These remove content the application never reads. Relax a rule later if valuable.
rules:
  - exclude: ".git/**"
  - exclude: ".approaches/**"
  - exclude: ".articles/**"
  - exclude: ".meta/tests.toml"
  - exclude: ".meta/*.j2"
  - exclude: ".meta/*.tera"
