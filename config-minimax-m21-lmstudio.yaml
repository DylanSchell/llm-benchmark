# Claude Benchmark Configuration
# Runner for the Aider polyglot benchmark suite using Claude Code

# Path to the polyglot-benchmark repository
benchmark_path: "../polyglot-benchmark"

# Docker configuration
docker:
  # Name of the custom Docker image with build tools
  image: "claude-benchmark/runner:latest"
  # Container working directory
  work_dir: "/workspace"
  # Timeout for exercise execution in seconds
  timeout: 7200
  # Memory limit for container (e.g., "2g")
  memory: "2g"
  # Environment variables to be set inside the runner
  environment:
    - ANTHROPIC_AUTH_TOKEN: "your-secret-key"
    - ANTHROPIC_API_KEY: ""
    - ANTHROPIC_MODEL: "minimax-m21-200b"
    - ANTHROPIC_DEFAULT_HAIKU_MODEL: "minimax-m21-200b"
    - ANTHROPIC_DEFAULT_OPUS_MODEL: "minimax-m21-200b"
    - ANTHROPIC_DEFAULT_SONNET_MODEL: "minimax-m21-200b"
    - ANTHROPIC_BASE_URL: "http://host.docker.internal:3456"
    - CLAUDE_CODE_MAX_OUTPUT_TOKENS: "100000"
    - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    - API_TIMEOUT_MS: "3000000"
    - CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
    - DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
    - DISABLE_PROMPT_CACHING: "1"
    - DISABLE_TELEMETRY: "1"
# Exercise configuration
exercise:
  # Language to run (java, python, go, rust, cpp, javascript)
  language: "java"
  # Specific exercise name (e.g., "series") - leave empty to run all
  name: "series"
  # Path to the exercise within the language directory
  path: "java/exercises/practice/series"

# Claude Code CLI configuration
claude:
  # Path to claude CLI binary
  cli_path: "/usr/local/bin/claude"
  # Model to use for solving exercises
  model: "sonnet"
  # Additional arguments to pass to claude
  extra_args: []

# Output configuration
output:
  # Directory for exercise outputs
  results_dir: "../benchmark-results/minimax-lmstudio"
  # Log level (DEBUG, INFO, WARN, ERROR)
  log_level: "INFO"
